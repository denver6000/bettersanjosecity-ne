name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Check no secrets reached the build output
        run: |
          if grep -rIl -e 'KCLOUD_API_KEY=' -e 'PSA_API_KEY=' out/; then
            echo "::error::An .env line was found in out/"
            exit 1
          fi
